+rules:
  - RULE-SET,reject_rules,REJECT-DROP
  - RULE-SET,proxy_rules,PROXY
  - RULE-SET,direct_rules,DIRECT

rule-providers:
  reject_rules:
    type: file
    behavior: classical
    format: text
    path: Rules/reject_rule.list
  proxy_rules:
    type: file
    behavior: classical
    format: text
    path: Rules/MyProxyRules.list
  direct_rules:
    type: file
    behavior: classical
    format: text
    path: Rules/MyDirectRules.list
